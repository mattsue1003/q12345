<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>足部自我檢查（範例）</title>
<style>
:root{--ink:#18181B;--paper:#FFFDF8;--line:#D9D4C7;--muted:#5B5B66;--ok:#1F7A4D;--warn:#B4231F;--amber:#FFE9A8;--soft:#F3EFE4}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:20px;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:1.7rem;line-height:1.3;margin:.2em 0 .3em}
h2{font-size:1.25rem;margin:1.2em 0 .4em}
p{margin:.4em 0}
.lead{color:var(--muted)}
.card{border:2px solid var(--ink);border-radius:14px;padding:16px 18px;margin:14px 0;background:#fff}
.step{display:flex;gap:14px;align-items:flex-start}
.step b.n{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:1.2rem}
button,.btn{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;padding:12px 22px;min-height:52px;cursor:pointer}
button.o{background:#fff;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid #2F6FED;outline-offset:2px}
input,select{font:inherit;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;min-height:52px;background:#fff;color:var(--ink);max-width:100%}
.warn{border-color:var(--warn);background:#FDECEA}
.okb{border-color:var(--ok);background:#E8F5EE}
.note{background:var(--amber);border-radius:12px;padding:12px 16px;margin:14px 0}
.disc{border-top:2px solid var(--line);margin-top:28px;padding-top:14px;font-size:.85rem;color:var(--muted)}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
@media print{button,.noprint{display:none!important}body{font-size:16px}}
</style>
</head>
<body>
<main>
<h1>每日足部自我檢查</h1>
<p class="lead">每天洗腳後花 2 分鐘，照順序看一遍。看不到腳底可以用鏡子，或請家人幫忙。</p>
<div id="list"></div>
<div class="row noprint"><button id="done" type="button">看結果</button><button id="clr" class="o" type="button">全部重來</button></div>
<div id="out" aria-live="polite"></div>
<div class="note">平常保養：溫水洗腳（水溫低於 37°C，先用手肘試溫）、擦乾趾縫、穿合腳的鞋襪、不要赤腳走路、不要自己剪雞眼或厚繭。</div>
<script>
(function(){var Q=['腳底、腳背或趾縫有沒有傷口、破皮或水泡？','有沒有紅、腫、發熱，或顏色變深、變紫的地方？','有沒有新的雞眼、厚繭或裂開？','趾甲有沒有嵌進肉裡、變厚或變色？','有沒有新出現、或比平常更明顯的麻、刺痛，或摸起來沒感覺的地方？','鞋子裡面有沒有小石頭、縫線凸起或磨腳的地方？'];
var L=document.getElementById('list');
Q.forEach(function(q,i){var d=document.createElement('div');d.className='card';d.innerHTML='<fieldset style="border:0;padding:0;margin:0"><legend style="font-weight:700;padding:0">'+(i+1)+'. '+q+'</legend><div class="row" style="margin-top:10px"><label class="row" style="min-height:52px;padding:6px 18px 6px 10px;border:2px solid var(--line);border-radius:12px"><input type="radio" name="q'+i+'" value="n" style="min-height:28px;width:28px"> 沒有</label><label class="row" style="min-height:52px;padding:6px 18px 6px 10px;border:2px solid var(--line);border-radius:12px"><input type="radio" name="q'+i+'" value="y" style="min-height:28px;width:28px"> 有</label></div></fieldset>';L.appendChild(d)});
document.getElementById('done').onclick=function(){var y=[],miss=0;Q.forEach(function(q,i){var c=document.querySelector('input[name=q'+i+']:checked');if(!c)miss++;else if(c.value==='y')y.push(i+1)});var o=document.getElementById('out');
if(miss){o.innerHTML='<div class="card">還有 '+miss+' 題沒有選，請每一題都選一個。</div>';return}
var shoe=y.indexOf(6)>=0,foot=y.filter(function(n){return n!==6});var h='';if(foot.length)h+='<div class="card warn"><b>第 '+foot.join('、')+' 題選了「有」。</b><br>請不要自己處理傷口或厚繭，盡快聯絡衛教師或回診檢查。傷口有流膿、發臭、範圍變大或發燒，請當天就醫。</div>';if(shoe)h+='<div class="card"><b>鞋子裡有東西或會磨腳。</b><br>把異物清掉；鞋子會磨腳請換一雙，並看一下腳上對應的位置有沒有紅或破皮。</div>';if(!y.length)h='<div class="card okb"><b>今天沒有發現異常。</b><br>明天同一個時間再檢查一次。</div>';o.innerHTML=h;o.scrollIntoView({behavior:'smooth',block:'center'})};
document.getElementById('clr').onclick=function(){[].forEach.call(document.querySelectorAll('input[type=radio]'),function(r){r.checked=false});document.getElementById('out').innerHTML=''};})();
</script>
<div class="disc"><b>使用說明與免責</b><br>本工具僅供衛教說明與自我管理提醒，不能取代醫師的診斷、處方與醫療建議。這份檢查表不會儲存或傳送你的答案。身體不舒服或有疑問，請聯絡你的醫療團隊；緊急狀況請撥 119。<br>衛教單位：（請填單位名稱）｜聯絡電話：（請填）｜版本：v1｜最後檢視日期：（請填）｜內容審核：（請填審核者）</div>
</main>
</body>
</html>
